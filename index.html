<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSC Mock Portal | Quizzes</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --border-color: #e6e0ac;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Inter", sans-serif; }

    body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.5; padding: 0 16px; }
    .container { max-width: 1000px; margin: 0 auto; padding: 40px 0; }
    .header { text-align: center; margin-bottom: 32px; }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #eff6ff;
      color: var(--primary);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .pill::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #10b981;
      animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.6); }
    }

    .header h1 { font-size: 2.8rem; font-weight: 800; color: var(--text-main); line-height: 1.1; }
    .header-name {
      position: relative;
      display: inline-block;
      font-family: "Caveat", cursive;
      font-size: 4rem;
      color: var(--primary);
      margin-top: -4px;
    }

    .header-name::after {
      content: "";
      position: absolute;
      left: 5%;
      right: 3%;
      bottom: 0.02em;
      height: 0.18em;
      border: solid currentColor;
      border-width: 0 0 4px 0;
      border-radius: 50%;
      transform: rotate(-1.5deg);
      opacity: 0.72;
      pointer-events: none;
    }
    .header p { color: var(--text-muted); font-size: 1rem; margin-top: 8px; }

    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 40px; }
    .stat-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; text-align: center; }
    .stat-value { font-size: 1.25rem; font-weight: 700; color: var(--text-main); }
    .stat-label { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.05em; }

    .section-title { font-size: 1.15rem; font-weight: 600; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; }
    .section-title::after { content: ""; flex: 1; height: 1px; background: var(--border-color); }
    .quiz-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .subject-panel { display: block; margin: -14px 0 28px; }
    .subject-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
    .subject-card {
      --accent: #2563eb;
      --subject-image: none;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 8px;
      aspect-ratio: 3 / 4;
      overflow: hidden;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px;
      background:
        linear-gradient(180deg, rgba(15, 23, 42, 0.04), rgba(15, 23, 42, 0.72)),
        var(--subject-image),
        var(--tile-bg, #eff6ff);
      background-size: cover;
      background-position: center;
      color: #ffffff;
      text-align: left;
      cursor: pointer;
      isolation: isolate;
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .subject-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 42%, transparent), transparent 54%);
      opacity: 0.52;
      z-index: -1;
    }
    .subject-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 12px 24px rgba(15, 23, 42, 0.13); }
    .subject-card.active { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent), 0 12px 24px rgba(15, 23, 42, 0.15); }
    .subject-icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
      backdrop-filter: blur(5px);
    }
    .subject-icon svg { width: 19px; height: 19px; stroke-width: 2; }
    .subject-copy { display: block; min-width: 0; text-shadow: 0 1px 8px rgba(15, 23, 42, 0.45); }
    .subject-name { display: block; font-size: 0.82rem; font-weight: 800; line-height: 1.12; overflow-wrap: anywhere; }
    .subject-count { display: block; margin-top: 3px; color: rgba(255, 255, 255, 0.84); font-size: 0.68rem; font-weight: 700; line-height: 1.15; }
    .subject-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .subject-heading { color: var(--text-muted); font-size: 0.82rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
    .clear-filter { border: 0; border-radius: 999px; padding: 7px 10px; background: #eff6ff; color: var(--primary); font-size: 0.76rem; font-weight: 700; cursor: pointer; }

    .quiz-card {
      --accent: #2563eb;
      --badge-bg: #eff6ff;
      --badge-text: #1d4ed8;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--accent);
      border-radius: 12px;
      padding: 16px;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      min-height: 172px;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .quiz-card:hover {
      border-color: var(--accent);
      box-shadow: 0 8px 20px -5px rgba(0, 0, 0, 0.08);
      transform: translateY(-2px);
    }

    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
    .subject-badge {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: var(--badge-bg);
      color: var(--badge-text);
    }

    .card-emoji { font-size: 1.45rem; line-height: 1; }
    .card-title { font-size: 1rem; font-weight: 600; color: var(--text-main); margin-bottom: 12px; line-height: 1.4; flex-grow: 1; }
    .card-meta { display: flex; flex-wrap: wrap; gap: 10px 12px; border-top: 1px solid var(--border-color); padding-top: 12px; margin-bottom: 12px; }
    .meta-item { display: flex; align-items: center; gap: 4px; font-size: 0.8rem; color: var(--text-muted); }
    .meta-icon { width: 14px; height: 14px; opacity: 0.7; flex: 0 0 auto; }
    .card-action { display: flex; align-items: center; justify-content: space-between; color: var(--primary); font-weight: 500; font-size: 0.85rem; }
    .card-action svg { transition: transform 0.2s; }
    .quiz-card:hover .card-action svg { transform: translateX(4px); }

    .state-card {
      grid-column: 1 / -1;
      background: #ffffff;
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      padding: 24px;
      color: var(--text-muted);
      text-align: center;
    }

    footer { text-align: center; padding: 30px 0; color: var(--text-muted); font-size: 0.8rem; }
    .heart { color: #ef4444; }

    @media (max-width: 768px) {
      .container { padding-top: 28px; }
      .header h1 { font-size: 2.2rem; }
      .header-name { font-size: 3.2rem; }
      .stats { grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 32px; }
      .stat-card { padding: 10px 6px; }
      .subject-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
      .subject-card { border-radius: 10px; padding: 8px; }
      .subject-icon { width: 28px; height: 28px; border-radius: 8px; }
      .subject-icon svg { width: 16px; height: 16px; }
      .subject-name { font-size: 0.72rem; }
      .subject-count { font-size: 0.58rem; }
      .quiz-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <span class="pill">SSC Mock Portal</span>
      <h1>Quizzes by <span class="header-name">Lakshay Suthar</span></h1>
      <p>Sharpen your knowledge. Ace the exam.</p>
    </header>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-value" id="stat-quizzes">0</div>
        <div class="stat-label">Quizzes</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-questions">0</div>
        <div class="stat-label">Questions</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-subjects">0</div>
        <div class="stat-label">Subjects</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">Free</div>
        <div class="stat-label">Access</div>
      </div>
    </div>

    <div class="subject-panel" id="subject-panel">
      <div class="subject-toolbar">
        <div class="subject-heading">Browse by subject</div>
        <button class="clear-filter" id="clear-subject-filter" type="button">Show all</button>
      </div>
      <div class="subject-grid" id="subject-grid"></div>
    </div>

    <h2 class="section-title" id="quiz-section-title">Available Quizzes</h2>
    <div class="quiz-grid" id="quiz-container">
      <div class="state-card">Loading quizzes...</div>
    </div>

    <footer>
      <p>Made with <span class="heart">&hearts;</span> by Lakshay Suthar</p>
    </footer>
  </div>

  <script>
    const subjectStyles = {
      history: { accent: "#c9a84c", bg: "#fef3c7", text: "#92400e" },
      polity: { accent: "#2563eb", bg: "#dbeafe", text: "#1e40af" },
      economy: { accent: "#0f766e", bg: "#ccfbf1", text: "#115e59" },
      chemistry: { accent: "#35a66f", bg: "#dcfce7", text: "#166534" },
      physics: { accent: "#4c8dcc", bg: "#dbeafe", text: "#1e40af" },
      science: { accent: "#4c8dcc", bg: "#e0f2fe", text: "#075985" },
      static: { accent: "#7c5cff", bg: "#ede9fe", text: "#5b21b6" },
      "static-gk-ca": { accent: "#7c5cff", bg: "#ede9fe", text: "#5b21b6" },
      math: { accent: "#0f766e", bg: "#ccfbf1", text: "#115e59" },
      reasoning: { accent: "#db2777", bg: "#fce7f3", text: "#9d174d" },
      default: { accent: "#2563eb", bg: "#eff6ff", text: "#1d4ed8" }
    };

    const subjectIcons = {
      history: '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"></path><path d="M4 4.5A2.5 2.5 0 016.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15z"></path></svg>',
      polity: '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 21h18"></path><path d="M5 21V9l7-5 7 5v12"></path><path d="M9 21v-7h6v7"></path></svg>',
      economy: '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 19V5"></path><path d="M4 19h16"></path><path d="M8 16l3-4 3 2 5-7"></path></svg>',
      chemistry: '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 2h6"></path><path d="M10 2v6l-5 9a3 3 0 002.6 4.5h8.8A3 3 0 0019 17l-5-9V2"></path><path d="M7.5 15h9"></path></svg>',
      physics: '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.8"></circle><path d="M4.5 12c0-2.5 3.4-4.5 7.5-4.5s7.5 2 7.5 4.5-3.4 4.5-7.5 4.5-7.5-2-7.5-4.5z"></path><path d="M8.25 5.5c2.15-1.25 5.12.7 7.17 4.25s2.25 7.1.1 8.34-5.12-.7-7.17-4.25-2.25-7.1-.1-8.34z"></path><path d="M15.75 5.5c-2.15-1.25-5.12.7-7.17 4.25s-2.25 7.1-.1 8.34 5.12-.7 7.17-4.25 2.25-7.1.1-8.34z"></path></svg>',
      static: '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M3.6 9h16.8"></path><path d="M3.6 15h16.8"></path><path d="M12 3a14 14 0 010 18"></path><path d="M12 3a14 14 0 000 18"></path></svg>',
      "static-gk-ca": '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M3.6 9h16.8"></path><path d="M3.6 15h16.8"></path><path d="M12 3a14 14 0 010 18"></path><path d="M12 3a14 14 0 000 18"></path></svg>',
      default: '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 3l8 4.5-8 4.5-8-4.5L12 3z"></path><path d="M4 12l8 4.5 8-4.5"></path><path d="M4 16.5l8 4.5 8-4.5"></path></svg>'
    };

    const quizContainer = document.getElementById("quiz-container");
    const subjectGrid = document.getElementById("subject-grid");
    const clearSubjectFilter = document.getElementById("clear-subject-filter");
    const quizSectionTitle = document.getElementById("quiz-section-title");
    let allQuizzes = [];
    let activeSubject = "";

    function slugify(value) {
      return String(value || "")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
    }

    function colorForSubject(key) {
      const palette = [
        ["#c9a84c", "#fef3c7", "#92400e"],
        ["#35a66f", "#dcfce7", "#166534"],
        ["#4c8dcc", "#dbeafe", "#1e40af"],
        ["#7c5cff", "#ede9fe", "#5b21b6"],
        ["#0f766e", "#ccfbf1", "#115e59"],
        ["#db2777", "#fce7f3", "#9d174d"],
        ["#ea580c", "#ffedd5", "#9a3412"],
        ["#0891b2", "#cffafe", "#155e75"],
        ["#9333ea", "#f3e8ff", "#6b21a8"]
      ];
      let hash = 0;
      for (const char of String(key || "default")) hash = (hash * 31 + char.charCodeAt(0)) >>> 0;
      const color = palette[hash % palette.length];
      return { accent: color[0], bg: color[1], text: color[2] };
    }

    function styleForSubject(quiz) {
      const key = quiz.subjectKey || slugify(quiz.subject) || "default";
      return subjectStyles[key] || colorForSubject(key);
    }

    function iconForSubject(key) {
      return subjectIcons[key] || subjectIcons.default;
    }

    function coverForSubject(key) {
      return `assets/subject-covers/${encodeURIComponent(key || "default")}.webp`;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#039;"
      }[char]));
    }

    function formatDate(value) {
      if (!value) return "Recently added";
      const date = new Date(`${value}T00:00:00`);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
    }

    function dateScore(value) {
      const time = Date.parse(`${value || ""}T00:00:00`);
      return Number.isNaN(time) ? 0 : time;
    }

    function renderStats(quizzes) {
      const totalQuestions = allQuizzes.reduce((sum, quiz) => sum + Number(quiz.questionCount || 0), 0);
      const subjects = new Set(allQuizzes.map(quiz => quiz.subject).filter(Boolean));
      document.getElementById("stat-quizzes").textContent = allQuizzes.length;
      document.getElementById("stat-questions").textContent = totalQuestions;
      document.getElementById("stat-subjects").textContent = subjects.size;
    }

    function groupedSubjects(quizzes) {
      const groups = new Map();
      quizzes.forEach(quiz => {
        const subject = quiz.subject || "General";
        const key = quiz.subjectKey || slugify(subject) || "general";
        const existing = groups.get(key) || { key, subject, count: 0, questions: 0, sample: quiz };
        existing.count += 1;
        existing.questions += Number(quiz.questionCount || 0);
        groups.set(key, existing);
      });
      return [...groups.values()].sort((a, b) => a.subject.localeCompare(b.subject));
    }

    function renderSubjects() {
      const subjects = groupedSubjects(allQuizzes);
      subjectGrid.innerHTML = subjects.map(subject => {
        const style = styleForSubject({ subject: subject.subject, subjectKey: subject.key });
        const activeClass = activeSubject === subject.key ? " active" : "";
        const cover = coverForSubject(subject.key);
        return `
          <button class="subject-card${activeClass}" type="button" data-subject="${escapeHtml(subject.key)}" style="--accent:${style.accent};--tile-bg:${style.bg};--subject-image:url('${escapeHtml(cover)}');">
            <span class="subject-icon" aria-hidden="true">${iconForSubject(subject.key)}</span>
            <span class="subject-copy">
              <span class="subject-name">${escapeHtml(subject.subject)}</span>
              <span class="subject-count">${subject.count} quizzes | ${subject.questions} Qs</span>
            </span>
          </button>
        `;
      }).join("");
    }

    function setSubjectFilter(subjectKey) {
      activeSubject = subjectKey || "";
      const visibleQuizzes = activeSubject
        ? allQuizzes.filter(quiz => (quiz.subjectKey || slugify(quiz.subject)) === activeSubject)
        : allQuizzes;
      const label = activeSubject
        ? groupedSubjects(allQuizzes).find(subject => subject.key === activeSubject)?.subject || "Subject"
        : "Available Quizzes";
      quizSectionTitle.textContent = activeSubject ? `${label} Quizzes` : "Available Quizzes";
      renderSubjects();
      renderQuizzes(visibleQuizzes);
    }

    function renderQuizzes(quizzes) {
      if (!quizzes.length) {
        quizContainer.innerHTML = '<div class="state-card">No quizzes found. Add a JSON file inside <strong>data/quizzes</strong>.</div>';
        renderStats([]);
        return;
      }

      quizContainer.innerHTML = quizzes.map(quiz => {
        const style = styleForSubject(quiz);
        const questionCount = Number(quiz.questionCount || 0);
        return `
          <a href="quiz.html?id=${encodeURIComponent(quiz.id)}" class="quiz-card" style="--accent:${style.accent};--badge-bg:${style.bg};--badge-text:${style.text};">
            <div class="card-header">
              <span class="subject-badge">${escapeHtml(quiz.subject || "General")}</span>
              <span class="card-emoji" aria-hidden="true">${escapeHtml(quiz.emoji || "")}</span>
            </div>
            <h3 class="card-title">${escapeHtml(quiz.title || quiz.id)}</h3>
            <div class="card-meta">
              <div class="meta-item">
                <svg class="meta-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span>${questionCount} Qs</span>
              </div>
              <div class="meta-item">
                <svg class="meta-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <span>${escapeHtml(formatDate(quiz.published))}</span>
              </div>
            </div>
            <div class="card-action">
              Start Quiz
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </div>
          </a>
        `;
      }).join("");

      renderStats(allQuizzes);
    }

    async function loadQuizzes() {
      try {
        const response = await fetch("data/quiz-manifest.json", { cache: "no-store" });
        if (!response.ok) throw new Error(`Manifest request failed: ${response.status}`);
        const manifest = await response.json();
        allQuizzes = Array.isArray(manifest.quizzes) ? manifest.quizzes : [];
        allQuizzes.sort((a, b) => dateScore(b.published) - dateScore(a.published));
        renderSubjects();
        setSubjectFilter("");
      } catch (error) {
        console.error(error);
        quizContainer.innerHTML = '<div class="state-card">Could not load quiz list. If you opened the file directly, use GitHub Pages or a local server.</div>';
      }
    }

    clearSubjectFilter.addEventListener("click", () => setSubjectFilter(""));

    subjectGrid.addEventListener("click", event => {
      const card = event.target.closest(".subject-card");
      if (!card) return;
      setSubjectFilter(card.dataset.subject || "");
    });

    document.addEventListener("DOMContentLoaded", loadQuizzes);
  </script>
</body>
</html>
